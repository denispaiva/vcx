<title>Tablero del portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: cabecera con filtros y resumen; vistas en pestañas. Tablero = carriles horizontales (backlog → sprints), línea de tiempo = grilla de semanas por proyecto. */
:root {
  --bg: #f4f2f3; --surface: #ffffff; --surface-2: #ebe7e9; --fg: #1d191b; --muted: #685f64; --line: #d8d1d5;
  --accent: #8a1c3c; --accent-fg: #ffffff; --accent-soft: #f4dfe6;
  --good: #23764a; --warn: #a35f00; --bad: #b3261e; --info: #255f92;
  --p0: #2f6db5; --p1: #c2410c; --p2: #15803d; --p3: #7c3aed; --p4: #a07400; --p5: #0e7490; --p6: #be185d; --p7: #4d7c0f; --p8: #9a3412; --p9: #475569;
  --display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 6px; --week: 26px; --label: 150px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141113; --surface: #1d191c; --surface-2: #292427; --fg: #eee8eb; --muted: #a89ea4; --line: #3a3337;
  --accent: #e3789a; --accent-fg: #1b0910; --accent-soft: #3e2029;
  --good: #6cc792; --warn: #e5a640; --bad: #f08a80; --info: #82b4e8;
  --p0: #6ea8f0; --p1: #fb8a4c; --p2: #4ade80; --p3: #b195fb; --p4: #e5b93f; --p5: #3cc4dc; --p6: #f472b6; --p7: #a3d14b; --p8: #f0956a; --p9: #a3b1c6;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141113; --surface: #1d191c; --surface-2: #292427; --fg: #eee8eb; --muted: #a89ea4; --line: #3a3337;
  --accent: #e3789a; --accent-fg: #1b0910; --accent-soft: #3e2029;
  --good: #6cc792; --warn: #e5a640; --bad: #f08a80; --info: #82b4e8;
  --p0: #6ea8f0; --p1: #fb8a4c; --p2: #4ade80; --p3: #b195fb; --p4: #e5b93f; --p5: #3cc4dc; --p6: #f472b6; --p7: #a3d14b; --p8: #f0956a; --p9: #a3b1c6;
  color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.45 }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; display: grid; gap: 18px; max-width: 1600px; margin: 0 auto }
.wrap > * { min-width: 0 }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0 }
h1 { font-size: 30px; font-weight: 700; letter-spacing: .01em }
h2 { font-size: 20px; font-weight: 600 }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums }
.muted { color: var(--muted) }
button, select, input { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between }
.title { display: grid; gap: 4px; min-width: 0 }
.sources { font-size: 12px; color: var(--muted) }
.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 8px }
.tabs button { border: 0; background: transparent; padding: 6px 14px; border-radius: 6px; font-family: var(--display); font-size: 16px; font-weight: 600; color: var(--muted) }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .12) }
.tabs .count { font-family: var(--mono); font-size: 12px; margin-left: 4px; color: var(--accent) }
.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 13px }
.chip[aria-pressed="true"] { border-color: var(--fg); background: var(--fg); color: var(--bg) }
.chip .n { font-family: var(--mono); font-size: 11px; opacity: .75 }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none }
.chip.kind { border-style: dashed }
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 6px; min-width: 0 }
.stat .k { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted) }
.stat .v { font-family: var(--display); font-size: 26px; font-weight: 700; line-height: 1 }
.stat .v small { font-family: var(--body); font-size: 13px; font-weight: 400; color: var(--muted) }
.bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--surface-2) }
.bar span { display: block; height: 100% }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted) }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: 0 }
details.stat summary { cursor: pointer; list-style-position: outside; margin-left: 14px }
.alerts { display: grid; gap: 4px; font-size: 13px; margin: 0; padding: 0; list-style: none }
.alerts li { display: flex; gap: 8px; align-items: baseline }
.alerts li::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); flex: none; transform: translateY(-1px) }
.alerts li.bad::before { background: var(--bad) }
.status { font-size: 12px; display: flex; gap: 8px; align-items: center; color: var(--muted) }
.status b { width: 8px; height: 8px; border-radius: 50%; background: var(--muted) }
.status.ok b { background: var(--good) } .status.off b { background: var(--warn) }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 13px; color: var(--muted) }
.toolbar label { display: inline-flex; gap: 6px; align-items: center }
/* Tablero */
.board { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; align-items: flex-start }
.lane { flex: 0 0 272px; background: var(--surface-2); border-radius: 8px; display: flex; flex-direction: column; max-height: 78vh; border: 2px solid transparent }
.lane.drop { border-color: var(--accent); background: var(--accent-soft) }
.lane.nodrop { opacity: .55 }
.lane header { padding: 10px 12px 8px; display: grid; gap: 4px; border-bottom: 1px solid var(--line) }
.lane header h3 { font-size: 17px; font-weight: 700; display: flex; gap: 8px; align-items: baseline; justify-content: space-between }
.lane header .sub { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px }
.tag { display: inline-flex; align-items: center; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; border: 1px solid currentColor }
.tag.vigente { color: var(--accent) } .tag.vencido { color: var(--bad) } .tag.futuro { color: var(--muted) } .tag.backlog { color: var(--info) }
.load { height: 5px; border-radius: 3px; background: var(--surface); overflow: hidden; display: flex }
.load span { height: 100% }
.lane-body { padding: 8px; display: grid; gap: 8px; overflow-y: auto; align-content: start; min-height: 60px }
.empty { font-size: 12px; color: var(--muted); padding: 8px; text-align: center; border: 1px dashed var(--line); border-radius: var(--radius) }
.card { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: var(--radius); padding: 8px 10px; display: grid; gap: 6px; cursor: grab; min-width: 0 }
.card:hover { border-color: var(--muted); border-left-color: var(--c) }
.card.dragging { opacity: .4 }
.card.proposed { border-style: dashed; border-left-style: solid; box-shadow: 0 0 0 2px var(--accent-soft) }
.card.done { opacity: .62 }
.card.locked { cursor: pointer }
.card.flash { box-shadow: 0 0 0 3px var(--accent) }
.card-top { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--muted); min-width: 0 }
.card-top .cid { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0 }
.pts { font-family: var(--mono); font-size: 12px; font-weight: 500; min-width: 26px; text-align: center; padding: 0 5px; border-radius: 10px; background: var(--surface-2); color: var(--fg) }
.pts.none { color: var(--muted); font-weight: 400; border: 1px dashed var(--line); background: transparent }
.pts.xl { background: var(--warn); color: var(--surface) }
.ctitle { font-family: var(--body); font-size: 13px; font-weight: 500; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere }
.chips { display: flex; flex-wrap: wrap; gap: 4px }
.mini { font-size: 11px; padding: 0 6px; border-radius: 4px; background: var(--surface-2); color: var(--muted); white-space: nowrap }
.mini.pri { font-family: var(--mono); color: var(--fg); background: transparent; border: 1px solid var(--fg) }
.mini.sug { font-family: var(--mono); border: 1px dashed var(--muted); background: transparent }
.mini.dec { color: var(--info); background: transparent; border: 1px solid var(--info) }
.mini.prop { background: var(--accent); color: var(--accent-fg) }
.mini.stale { background: var(--bad); color: var(--surface) }
.mini.big { color: var(--warn); background: transparent; border: 1px solid var(--warn) }
.mini.est { font-family: var(--mono); background: transparent; border: 1px dotted var(--muted) }
.ghost { border: 1px dashed var(--muted); border-radius: var(--radius); padding: 8px 10px; font-size: 12px; display: grid; gap: 4px; background: transparent }
.ghost h4 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600 }
.ghost button { all: unset; cursor: pointer; display: flex; gap: 6px; align-items: baseline; min-width: 0 }
.ghost button:focus-visible { outline: 2px solid var(--accent) }
.ghost button span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0 }
.hint { font-size: 12px; color: var(--muted) }
/* Línea de tiempo */
.tl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; position: relative }
.tl { display: grid; position: relative; min-width: max-content; padding-bottom: 6px }
.tl .lbl { position: sticky; left: 0; background: var(--surface); z-index: 2; padding: 6px 10px; font-size: 13px; display: flex; gap: 6px; align-items: center; border-right: 1px solid var(--line); min-width: 0 }
.tl .lbl span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.tl .wk { font-family: var(--mono); font-size: 10px; color: var(--muted); text-align: center; padding: 6px 0 2px; border-bottom: 1px solid var(--line) }
.tl .wk.month { color: var(--fg); text-align: left; padding-left: 2px; white-space: nowrap; overflow: visible }
.tl .row-bg { grid-column: 2 / -1; border-bottom: 1px solid var(--line); }
.sp { margin: 5px 1px; border-radius: 4px; padding: 2px 4px; font-family: var(--mono); font-size: 10px; display: flex; gap: 3px; align-items: center; overflow: hidden; border: 1px solid var(--c); cursor: pointer; z-index: 1; min-height: 26px; background: var(--surface); color: var(--fg) }
.sp.closed { background: color-mix(in srgb, var(--c) 22%, var(--surface)) }
.sp.current { background: var(--c); color: var(--surface); font-weight: 500 }
.sp.overdue { border: 2px solid var(--bad) }
.sp.planned { border-style: solid; background: var(--surface) }
.sp.est { border-style: dashed; opacity: .8 }
.sp.sel { outline: 2px solid var(--fg); outline-offset: 1px }
.dia { width: 8px; height: 8px; transform: rotate(45deg); flex: none; border: 1px solid var(--surface) }
.dia.accepted { background: var(--good) } .dia.review { background: var(--info) } .dia.in_progress { background: var(--warn) } .dia.planned { background: var(--muted) } .dia.miss { background: var(--bad) }
.today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); z-index: 3; pointer-events: none }
.today::after { content: "hoy"; position: absolute; bottom: 2px; left: 4px; font-size: 10px; font-family: var(--mono); color: var(--accent) }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0 }
.tablewrap { overflow-x: auto }
table { border-collapse: collapse; width: 100%; font-size: 13px }
th, td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600 }
td.num { font-family: var(--mono); text-align: right }
td.mono { white-space: nowrap }
.st { font-size: 12px; white-space: nowrap }
.st.accepted, .st.done, .st.completed { color: var(--good) } .st.review { color: var(--info) } .st.in_progress, .st.active { color: var(--warn) } .st.planned { color: var(--muted) } .st.blocked, .st.miss { color: var(--bad) }
/* Propuestas */
.props { display: grid; gap: 8px }
.prop { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 6px }
.prop .row { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; justify-content: space-between }
.prop ul { margin: 0; padding-left: 18px }
pre.cmds { margin: 0; background: var(--surface-2); border-radius: var(--radius); padding: 10px 12px; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 360px; overflow-y: auto }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 12px; font-size: 13px }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent) }
.btn.danger { color: var(--bad) }
.btn:disabled { opacity: .5; cursor: not-allowed }
/* Detalle */
dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); padding: 0; width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 48px) }
dialog::backdrop { background: rgb(10 5 8 / .45) }
.dlg { padding: 18px 20px; display: grid; gap: 12px }
.dlg h2 { font-size: 22px }
.dlg .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.dlg p { margin: 0; max-width: 65ch; overflow-wrap: anywhere }
.dlg section { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px }
.dlg h3 { font-size: 15px; font-weight: 700 }
.formrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.formrow select, .formrow input { border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; background: var(--surface) }
.parts { display: grid; gap: 6px }
.part { display: grid; grid-template-columns: 1fr 72px auto; gap: 6px }
.part input { border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; background: var(--surface); min-width: 0 }
.close { position: sticky; top: 0; float: right; margin: 10px 10px 0 0 }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 6px; font-size: 13px; z-index: 20; max-width: calc(100vw - 32px) }
.nodata { padding: 40px 0; color: var(--muted) }
@media (max-width: 640px) { h1 { font-size: 24px } .lane { flex-basis: 240px } :root { --label: 110px } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
</style>

<div class="wrap" id="app">
  <div class="top">
    <div class="title">
      <h1>Tablero del portfolio</h1>
      <div class="sources" id="sources"></div>
    </div>
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-view="tablero" id="tab-tablero">Tablero</button>
      <button role="tab" data-view="linea" id="tab-linea">Línea de tiempo</button>
      <button role="tab" data-view="propuestas" id="tab-propuestas">Propuestas<span class="count" id="propcount"></span></button>
    </div>
  </div>
  <div class="filters" id="filters" aria-label="Filtrar por proyecto"></div>
  <div class="summary" id="summary"></div>
  <section id="view-tablero" class="view" aria-labelledby="tab-tablero"></section>
  <section id="view-linea" class="view" aria-labelledby="tab-linea" hidden></section>
  <section id="view-propuestas" class="view" aria-labelledby="tab-propuestas" hidden></section>
</div>
<dialog id="detail"></dialog>
<div class="toast" id="toast" hidden></div>

<script>
const DATA = /*DATA*/null/*END*/;
(function () {
  const app = document.getElementById('app');
  if (!DATA) { app.innerHTML = '<p class="nodata">Esta es la plantilla sin datos. Generá la vista con build_portfolio_board_view.py.</p>'; return; }

  // ---------- utilidades ----------
  const DAY = 864e5;
  const toT = s => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
  const toS = t => new Date(t).toISOString().slice(0, 10);
  const TODAY = DATA.today, NOW = toT(TODAY);
  const fmt = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) : '';
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const sum = a => a.reduce((x, y) => x + y, 0);
  const median = a => { if (!a.length) return null; const s = a.slice().sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : Math.round((s[m - 1] + s[m]) / 2); };
  const PRI = { P0: 0, P1: 1, P2: 2 };
  const BIG = 13;
  const shortSp = id => id ? id.replace(/^SP-\d{4}-/, '') : '';
  const L = {
    task: { done: 'hecha', active: 'activa', planned: 'planificada', blocked: 'bloqueada', archived: 'archivada' },
    item: { open: 'sin curar', triaged: 'curado', promoted: 'promovido', withdrawn: 'retirado', declined: 'rechazado' },
    sprint: { completed: 'cerrado', active: 'activo', planned: 'planificado' },
    hito: { accepted: 'aceptado', review: 'en revisión', in_progress: 'en curso', planned: 'planificado' },
  };
  function isoWeekId(t) {
    const dow = (new Date(t).getUTCDay() + 6) % 7, thu = t + (3 - dow) * DAY, y = new Date(thu).getUTCFullYear();
    const jan4 = Date.UTC(y, 0, 4), w1 = jan4 - ((new Date(jan4).getUTCDay() + 6) % 7) * DAY;
    return `SP-${y}-W${String(Math.floor((thu - w1) / (7 * DAY)) + 1).padStart(2, '0')}`;
  }
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem('pb:' + k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem('pb:' + k, JSON.stringify(v)); } catch { /* sin almacenamiento */ } },
  };
  let toastTimer;
  function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 4200); }

  // ---------- modelo base ----------
  const PROJ = DATA.projects.slice().sort((a, b) => (a.kind === b.kind ? 0 : a.kind === 'proyecto' ? -1 : 1) || a.title.localeCompare(b.title, 'es'));
  PROJ.forEach((p, i) => { p.color = `var(--p${i % 10})`; });
  const P = Object.fromEntries(PROJ.map(p => [p.id, p]));
  const SPR = {};
  for (const s of DATA.sprints) (SPR[s.project] ||= []).push({ ...s, declared: true });
  Object.values(SPR).forEach(l => l.sort((a, b) => a.start.localeCompare(b.start)));
  const stateOf = s => toT(s.end) < NOW ? 'pasado' : toT(s.start) <= NOW ? 'vigente' : 'futuro';

  const cadenceCache = {};
  function sprintsOf(pid) {
    if (cadenceCache[pid]) return cadenceCache[pid];
    const list = (SPR[pid] || []).slice();
    const p = P[pid];
    if (list.length && p && p.kind === 'proyecto' && p.status !== 'done') {
      let t = toT(list[list.length - 1].start), future = 0;
      while (future < 12) {
        t += 14 * DAY;
        const s = { project: pid, id: isoWeekId(t), start: toS(t), end: toS(t + 13 * DAY), status: null, declared: false };
        if (toT(s.end) >= NOW) { list.push(s); future++; }
      }
    }
    return (cadenceCache[pid] = list);
  }
  const sprintOf = (pid, id) => sprintsOf(pid).find(s => s.id === id);

  function velocity(pid) {
    const closed = (SPR[pid] || []).filter(s => s.status === 'completed').slice().reverse();
    const vals = [];
    for (const s of closed) {
      const pts = sum(DATA.tasks.filter(t => t.project === pid && t.sprintId === s.id && t.status === 'done' && t.points).map(t => t.points));
      if (pts > 0) vals.push(pts);
      if (vals.length === 3) break;
    }
    return vals.length ? { value: Math.round(sum(vals) / vals.length), n: vals.length } : null;
  }
  const VEL = Object.fromEntries(PROJ.map(p => [p.id, velocity(p.id)]));
  const MED = {};
  for (const p of PROJ) MED[p.id] = median(DATA.backlog.filter(b => b.project === p.id && b.points).map(b => b.points)) ?? median(DATA.backlog.filter(b => b.points).map(b => b.points)) ?? 3;

  // ---------- estado ----------
  const ALL = new Set(PROJ.map(p => p.id));
  const saved = store.get('filter');
  const state = {
    filter: new Set(Array.isArray(saved) ? saved.filter(x => ALL.has(x)) : []),
    view: [location.hash.slice(1), store.get('view'), 'tablero'].find(v => ['tablero', 'linea', 'propuestas'].includes(v)),
    showClosed: !!store.get('closed'),
    proposals: new Map(), db: null, dbStatus: 'conectando', canWrite: true, userId: null,
    sel: null, flash: null, alertsOpen: false,
  };
  const inFilter = pid => !state.filter.size || state.filter.has(pid);

  // ---------- tarjetas con propuestas aplicadas ----------
  function baseCards() {
    const out = [];
    for (const t of DATA.tasks) {
      if (t.status === 'archived') continue;
      out.push({ key: `t:${t.project}/${t.id}`, type: 'task', project: t.project, ref: t, label: `${t.project} · ${t.id}`, title: t.title, points: t.points, status: t.status, src: t.sprintId });
    }
    for (const b of DATA.backlog) {
      const src = b.status === 'open' ? 'open' : b.status === 'triaged' ? 'triaged' : 'closed';
      out.push({ key: `b:${b.id}`, type: 'backlog', project: b.project, ref: b, label: b.id, title: b.title, points: b.points, status: b.status, src, priority: b.priority });
    }
    return out;
  }
  const BASE = baseCards();
  const BASEMAP = new Map(BASE.map(c => [c.key, c]));
  const srcSnapshot = c => ({ lane: c.src, status: c.status, points: c.points ?? null, priority: c.priority ?? null });
  function isStale(p, base) { if (!p || !p.base || !base) return false; const s = srcSnapshot(base); return s.lane !== p.base.lane || s.status !== p.base.status; }

  function cards() {
    const out = [];
    for (const b of BASE) {
      const p = state.proposals.get(b.key);
      const triage = p?.triage?.priority || null;
      const lane = p?.move?.to || (triage && b.src === 'open' ? 'triaged' : b.src);
      const common = { ...b, lane, priority: triage || b.priority, proposal: p || null, stale: isStale(p, b) };
      const parts = p?.split?.parts;
      if (parts?.length) {
        parts.forEach((pt, i) => out.push({ ...common, key: `${b.key}~${i + 1}`, parent: b.key, partIndex: i, partCount: parts.length, title: pt.title, points: pt.points ?? null, lane: pt.to || lane, label: `${b.label} · ${i + 1}/${parts.length}` }));
      } else out.push(common);
    }
    return out;
  }
  const order = c => { const conf = c.priority, sug = c.ref.suggestedPriority, eff = conf || sug; return [eff ? PRI[eff] : 3, conf ? 0 : 1, c.ref.requestedAt || '', c.partIndex || 0]; };
  const cmp = (a, b) => { const x = order(a), y = order(b); for (let i = 0; i < x.length; i++) { if (x[i] < y[i]) return -1; if (x[i] > y[i]) return 1; } return 0; };
  const ptsOf = c => c.points ?? MED[c.project];

  // ---------- proyección estimada ----------
  function projection(all) {
    const lanes = new Map(), eta = new Map(), beyond = new Map(), noVel = new Map();
    for (const p of PROJ) {
      const queue = all.filter(c => c.project === p.id && c.type === 'backlog' && (c.lane === 'open' || c.lane === 'triaged') && c.ref.kind !== 'decision').sort(cmp);
      if (!queue.length) continue;
      const v = VEL[p.id];
      if (!v) { noVel.set(p.id, queue); queue.forEach(c => eta.set(c.key, null)); continue; }
      let i = 0;
      for (const s of sprintsOf(p.id).filter(s => stateOf(s) !== 'pasado')) {
        let load = sum(all.filter(c => c.project === p.id && c.lane === s.id).map(ptsOf));
        const list = [];
        while (i < queue.length) {
          const c = queue[i], pts = ptsOf(c);
          if (load + pts > v.value && (list.length || load > 0)) break;
          list.push(c); eta.set(c.key, s.id); load += pts; i++;
        }
        if (list.length) lanes.set(`${p.id}|${s.id}`, list);
        if (i >= queue.length) break;
      }
      if (i < queue.length) { beyond.set(p.id, queue.slice(i)); queue.slice(i).forEach(c => eta.set(c.key, 'beyond')); }
    }
    return { lanes, eta, beyond, noVel };
  }

  // ---------- reglas de arrastre ----------
  function canDrop(c, lane) {
    if (!state.canWrite || !c) return false;
    if (c.type === 'task') {
      if (c.status === 'done' || lane === 'open' || lane === 'triaged' || lane === 'closed') return false;
      const s = sprintOf(c.project, lane); return !!s && stateOf(s) !== 'pasado';
    }
    if (c.src === 'closed') return false;
    if (lane === 'closed') return false;
    if (lane === 'open') return c.src === 'open';
    if (lane === 'triaged') return true;
    const s = sprintOf(c.project, lane); return !!s && stateOf(s) !== 'pasado';
  }

  // ---------- persistencia de propuestas ----------
  const writes = new Map();
  const empty = p => !p || (!p.move && !p.triage && !(p.split && p.split.parts && p.split.parts.length));
  const safeId = key => key.replace(/\//g, '+');
  function saveProposal(key, p) {
    const base = BASEMAP.get(key);
    if (!empty(p)) { p.key = key; p.project = base.project; p.type = base.type; p.base = p.base || srcSnapshot(base); p.at = new Date().toISOString(); p.by = state.userId; p.dataRev = DATA.sources.queue.sha + '/' + DATA.sources.roadmaps.sha; }
    if (empty(p)) state.proposals.delete(key); else state.proposals.set(key, p);
    render();
    if (!state.db) return;
    const ref = state.db.doc('proposals/' + safeId(key));
    const body = empty(p) ? null : JSON.parse(JSON.stringify(p));
    const next = (writes.get(key) || Promise.resolve()).then(() => body ? ref.set(body) : ref.delete()).catch(e => {
      if (e && e.code === 'invalid_argument' && state.canWrite) { state.canWrite = false; render(); toast('No tenés permiso para guardar propuestas en este artifact. La vista queda de solo lectura.'); }
      else if (e && e.code === 'quota_exceeded') toast('La base del artifact está llena. Descartá propuestas viejas para guardar nuevas.');
      else toast('No se pudo guardar la propuesta. Probá de nuevo en un momento.');
    });
    writes.set(key, next);
  }
  const clone = p => p ? JSON.parse(JSON.stringify(p)) : {};

  function applyMove(cardKey, lane) {
    const all = cards(); const c = all.find(x => x.key === cardKey); if (!c || !canDrop(c, lane)) return;
    const rootKey = c.parent || c.key, base = BASEMAP.get(rootKey);
    const p = clone(state.proposals.get(rootKey));
    let msg;
    if (c.parent) {
      const part = p.split.parts[c.partIndex];
      const inherited = p.move?.to || (p.triage && base.src === 'open' ? 'triaged' : base.src);
      part.to = lane === inherited ? null : lane;
      if (lane !== 'open' && lane !== 'triaged' && base.src === 'open' && !p.triage) p.triage = { priority: base.ref.suggestedPriority || 'P2' };
      msg = lane === 'open' || lane === 'triaged' ? 'Parte devuelta al backlog.' : `Parte propuesta para ${lane}.`;
    } else if (lane === 'open') { delete p.move; delete p.triage; msg = 'Propuesta de curado descartada.'; }
    else if (lane === 'triaged') {
      delete p.move;
      if (base.src === 'open' && !p.triage) { p.triage = { priority: base.ref.suggestedPriority || 'P2' }; msg = `Curado propuesto con ${p.triage.priority}${base.ref.suggestedPriority ? ', la prioridad sugerida' : ''}. Podés cambiarla en el detalle.`; }
      else msg = 'Devuelto a curado.';
    } else {
      if (lane === base.src) delete p.move; else p.move = { to: lane };
      if (base.type === 'backlog' && base.src === 'open' && !p.triage) p.triage = { priority: base.ref.suggestedPriority || 'P2' };
      msg = base.type === 'task' ? (lane === base.src ? 'Tarea devuelta a su sprint.' : `Movida propuesta a ${lane}.`) : `Programación propuesta en ${lane}.`;
    }
    state.flash = cardKey;
    saveProposal(rootKey, p);
    toast(msg);
  }

  // ---------- render común ----------
  function renderSources() {
    const s = DATA.sources;
    const st = { conectando: ['', 'Conectando con la base de propuestas…'], ok: ['ok', 'Propuestas guardadas en el artifact'], lento: ['off', 'La base de propuestas no responde todavía'], off: ['off', 'Propuestas solo en esta sesión: la base del artifact no está disponible'], error: ['off', 'La base de propuestas dejó de responder; recargá para reintentar'] }[state.dbStatus] || ['off', ''];
    document.getElementById('sources').innerHTML =
      `Roadmaps: <span class="mono">${esc(s.roadmaps.ref)} ${esc(s.roadmaps.sha)}</span> del ${fmt(s.roadmaps.date.slice(0, 10))} · Cola: <span class="mono">${esc(s.queue.ref)} ${esc(s.queue.sha)}</span> del ${fmt(s.queue.date.slice(0, 10))} · Referencia: ${fmt(TODAY)}/${TODAY.slice(0, 4)} · Solo lectura del precursor, sin fetch` +
      `<div class="status ${st[0]}"><b></b>${esc(st[1])}${state.canWrite ? '' : ' · solo lectura'}</div>`;
  }
  function renderFilters() {
    const n = pid => DATA.backlog.filter(b => b.project === pid && (b.status === 'open' || b.status === 'triaged')).length;
    const chip = p => `<button class="chip${p.kind === 'idea' ? ' kind' : ''}" aria-pressed="${state.filter.has(p.id)}" data-proj="${esc(p.id)}" style="--c:${p.color}"><span class="dot"></span>${esc(p.title)}${n(p.id) ? `<span class="n">${n(p.id)}</span>` : ''}</button>`;
    document.getElementById('filters').innerHTML =
      `<button class="chip" aria-pressed="${!state.filter.size}" data-proj="">Todos</button>` +
      PROJ.filter(p => p.kind === 'proyecto').map(chip).join('') + '<span class="muted" style="font-size:12px;margin-left:6px">Ideas:</span>' + PROJ.filter(p => p.kind === 'idea').map(chip).join('');
  }

  function alerts(all) {
    const out = [];
    for (const p of PROJ.filter(p => inFilter(p.id))) {
      for (const s of SPR[p.id] || []) {
        if (stateOf(s) === 'pasado' && s.status !== 'completed') out.push({ cls: 'bad', t: `${p.title}: ${shortSp(s.id)} figura ${L.sprint[s.status] || s.status} y terminó el ${fmt(s.end)}.` });
      }
      const openPast = DATA.tasks.filter(t => t.project === p.id && ['planned', 'active', 'blocked'].includes(t.status) && t.sprintId && sprintOf(p.id, t.sprintId) && stateOf(sprintOf(p.id, t.sprintId)) === 'pasado');
      if (openPast.length) out.push({ t: `${p.title}: ${openPast.length} tarea(s) abiertas en sprints ya terminados.` });
      const missed = DATA.deliverables.filter(d => d.project === p.id && d.status !== 'accepted' && d.sprintId && sprintOf(p.id, d.sprintId) && stateOf(sprintOf(p.id, d.sprintId)) === 'pasado');
      if (missed.length) out.push({ t: `${p.title}: ${missed.length} hito(s) sin aceptar en sprints pasados.` });
    }
    const big = all.filter(c => inFilter(c.project) && (c.lane !== 'closed') && c.status !== 'done' && (c.points || 0) >= BIG);
    if (big.length) out.push({ t: `${big.length} tarjeta(s) de ${BIG} puntos o más: conviene partirlas.` });
    const late = DATA.backlog.filter(b => inFilter(b.project) && b.decideBy && b.decideBy < TODAY && (b.status === 'open' || b.status === 'triaged'));
    if (late.length) out.push({ cls: 'bad', t: `${late.length} decisión(es) pendientes con fecha límite vencida.` });
    for (const w of DATA.warnings) out.push({ t: w });
    return out;
  }
  function vigentes() {
    const m = new Map();
    for (const p of PROJ.filter(p => inFilter(p.id) && p.status !== 'done')) {
      const s = sprintsOf(p.id).find(s => stateOf(s) === 'vigente');
      if (!s) continue;
      const e = m.get(s.id) || { s, projects: [], declared: [] }; e.projects.push(p); if (s.declared) e.declared.push(p); m.set(s.id, e);
    }
    return [...m.values()].sort((a, b) => a.s.start.localeCompare(b.s.start));
  }
  function renderSummary(all) {
    const items = DATA.backlog.filter(b => inFilter(b.project));
    const act = all.filter(c => c.type === 'backlog' && inFilter(c.project) && (c.lane !== 'closed'));
    const actRoots = items.filter(b => b.status === 'open' || b.status === 'triaged');
    const cur = actRoots.filter(b => b.status === 'triaged').length, unc = actRoots.length - cur;
    const closed = items.length - actRoots.length;
    const sized = actRoots.filter(b => b.points).length;
    const big = actRoots.filter(b => (b.points || 0) >= BIG).length;
    const pct = (a, b) => b ? (100 * a / b).toFixed(1) : 0;
    const vg = vigentes();
    const al = alerts(all);
    document.getElementById('summary').innerHTML = `
      <div class="stat"><span class="k">Backlog total</span><span class="v">${items.length} <small>pedidos</small></span>
        <div class="bar"><span style="width:${pct(actRoots.length, items.length)}%;background:var(--accent)"></span><span style="width:${pct(closed, items.length)}%;background:var(--line)"></span></div>
        <div class="legend"><span><i style="background:var(--accent)"></i>${actRoots.length} activos</span><span><i style="background:var(--line)"></i>${closed} cerrados</span></div></div>
      <div class="stat"><span class="k">Curado</span><span class="v">${cur} <small>de ${actRoots.length} activos</small></span>
        <div class="bar"><span style="width:${pct(cur, actRoots.length)}%;background:var(--info)"></span></div>
        <div class="legend"><span><i style="background:var(--info)"></i>${cur} curados</span><span><i style="background:var(--surface-2);border:1px solid var(--line)"></i>${unc} faltan curar</span></div></div>
      <div class="stat"><span class="k">Tallado</span><span class="v">${sized} <small>de ${actRoots.length} con puntos</small></span>
        <div class="bar"><span style="width:${pct(sized - big, actRoots.length)}%;background:var(--good)"></span><span style="width:${pct(big, actRoots.length)}%;background:var(--warn)"></span></div>
        <div class="legend"><span><i style="background:var(--good)"></i>${sized - big} tallados</span><span><i style="background:var(--warn)"></i>${big} grandes</span><span>${actRoots.length - sized} sin tallar</span></div></div>
      <div class="stat"><span class="k">Sprint vigente</span>${vg.length ? vg.map(e => `<div><b class="mono">${shortSp(e.s.id)}</b> <span class="muted">${fmt(e.s.start)}–${fmt(e.s.end)}</span><br><span class="muted" style="font-size:12px">${e.projects.map(p => esc(p.title)).join(', ')}${e.declared.length < e.projects.length ? ' · sin planificar en el roadmap' + (e.declared.length ? ` salvo ${e.declared.map(p => esc(p.title)).join(', ')}` : '') : ''}</span></div>`).join('') : '<span class="muted">Ninguno en el filtro.</span>'}</div>
      ${al.length ? `<details class="stat" style="grid-column:1/-1" id="alertsBox"${state.alertsOpen ? ' open' : ''}><summary><span class="k">Para revisar · ${al.length}</span> <span class="muted" style="font-size:13px">${esc(al.slice(0, 2).map(a => a.t).join(' '))}${al.length > 2 ? ' …' : ''}</span></summary><ul class="alerts" style="margin-top:8px">${al.map(a => `<li class="${a.cls || ''}">${esc(a.t)}</li>`).join('')}</ul></details>` : ''}`;

  // ---------- tablero ----------
  function cardHtml(c, eta) {
    const pts = c.points == null ? `<span class="pts none" title="Sin tallar">s/t</span>` : `<span class="pts${c.points >= BIG ? ' xl' : ''}" title="${c.points} puntos">${c.points}</span>`;
    const chips = [];
    if (c.type === 'backlog') {
      if (c.priority) chips.push(`<span class="mini pri" title="Prioridad confirmada">${c.priority}</span>`);
      else if (c.ref.suggestedPriority) chips.push(`<span class="mini sug" title="Prioridad sugerida, sin confirmar">${c.ref.suggestedPriority}?</span>`);
      if (c.ref.kind === 'decision') chips.push(`<span class="mini dec">decisión</span>`);
      if (c.lane === 'open' || c.lane === 'triaged') {
        const e = eta.get(c.key);
        if (e === 'beyond') chips.push(`<span class="mini est" title="No entra en el horizonte de 12 sprints">≈ más allá</span>`);
        else if (e) chips.push(`<span class="mini est" title="Sprint estimado por velocidad">≈ ${shortSp(e)}</span>`);
        else if (c.ref.kind !== 'decision' && e === null) chips.push(`<span class="mini est" title="El proyecto no tiene velocidad histórica">sin estimar</span>`);
      }
      if (c.lane === 'closed') chips.push(`<span class="mini">${L.item[c.status] || c.status}</span>`);
    } else {
      chips.push(`<span class="mini">${L.task[c.status] || c.status}</span>`);
      if (isPast(c)) chips.push(`<span class="mini" style="color:var(--bad)" title="Sprint ya terminado">de ${shortSp(c.lane)}</span>`);
      if (c.ref.epicId) chips.push(`<span class="mini" title="${esc(c.ref.epic)}">${esc(c.ref.epicId)}</span>`);
    }
    if ((c.points || 0) >= BIG && c.status !== 'done') chips.push(`<span class="mini big">conviene partir</span>`);
    if (c.proposal) chips.push(`<span class="mini prop">propuesta</span>`);
    if (c.stale) chips.push(`<span class="mini stale" title="La fuente cambió desde que se hizo la propuesta">fuente cambió</span>`);
    const locked = c.status === 'done' || c.lane === 'closed' || !state.canWrite;
    return `<article class="card${c.proposal ? ' proposed' : ''}${c.status === 'done' ? ' done' : ''}${locked ? ' locked' : ''}${state.flash === c.key ? ' flash' : ''}" style="--c:${P[c.project]?.color}" data-key="${esc(c.key)}" draggable="${!locked}" tabindex="0" aria-label="${esc(c.title)}">
      <div class="card-top"><span class="cid">${esc(c.label)}</span>${pts}</div>
      <h3 class="ctitle">${esc(c.title)}</h3>
      <div class="chips">${chips.join('')}</div></article>`;
  }

  function boardLanes(all, proj) {
    const lanes = [
      { id: 'open', title: 'Sin curar', kind: 'backlog', sub: 'Pedidos sin prioridad confirmada' },
      { id: 'triaged', title: 'Curado', kind: 'backlog', sub: 'Prioridad confirmada, sin sprint' },
    ];
    if (state.showClosed) lanes.push({ id: 'closed', title: 'Cerrados', kind: 'backlog', sub: 'Promovidos, retirados o rechazados' });
    const sp = new Map();
    for (const p of PROJ.filter(p => inFilter(p.id))) {
      let nextShown = 0;
      for (const s of sprintsOf(p.id)) {
        const st = stateOf(s);
        const has = all.some(c => c.project === p.id && c.lane === s.id);
        const open = all.some(c => c.project === p.id && c.lane === s.id && c.status !== 'done');
        let show = false;
        if (st === 'vigente') show = true;
        else if (st === 'futuro') { show = has || proj.lanes.has(`${p.id}|${s.id}`) || nextShown < 3; nextShown++; }
        if (!show) continue;
        const e = sp.get(s.id) || { id: s.id, start: s.start, end: s.end, kind: 'sprint', state: st, projects: [] };
        e.projects.push({ p, s }); sp.set(s.id, e);
      }
    }
    if (all.some(c => inFilter(c.project) && c.status !== 'done' && isPast(c))) lanes.push({ id: '__past', title: 'Vencidos', kind: 'past', sub: 'Trabajo abierto en sprints ya terminados' });
    return lanes.concat([...sp.values()].sort((a, b) => a.start.localeCompare(b.start)));
  }
  function isPast(c) { if (c.lane === 'open' || c.lane === 'triaged' || c.lane === 'closed') return false; const s = sprintOf(c.project, c.lane); return !!s && stateOf(s) === 'pasado'; }

  function renderBoard(all, proj) {
    const el = document.getElementById('view-tablero');
    const scroll = el.querySelector('.board')?.scrollLeft || 0;
    const lanes = boardLanes(all, proj);
    const html = lanes.map(l => {
      let list = l.kind === 'past' ? all.filter(c => inFilter(c.project) && c.status !== 'done' && isPast(c)) : all.filter(c => inFilter(c.project) && c.lane === l.id);
      let head, ghost = '';
      if (l.kind === 'past') {
        list.sort((a, b) => a.lane.localeCompare(b.lane) || a.project.localeCompare(b.project));
        head = `<h3>${l.title}<span class="mono muted" style="font-size:13px">${list.length}</span></h3><div class="sub"><span class="tag vencido">vencido</span><span>${l.sub}. Arrastralas a un sprint vigente o futuro.</span><span class="mono">${sum(list.filter(c => c.points).map(c => c.points))} pts</span></div>`;
      } else if (l.kind === 'backlog') {
        list.sort(cmp);
        const pts = sum(list.filter(c => c.points).map(c => c.points));
        head = `<h3>${l.title}<span class="mono muted" style="font-size:13px">${list.length}</span></h3><div class="sub"><span class="tag backlog">backlog</span><span>${l.sub}</span><span class="mono">${pts} pts tallados · ${list.filter(c => c.points == null).length} s/t</span></div>`;
      } else {
        list.sort((a, b) => (a.type === b.type ? 0 : a.type === 'task' ? -1 : 1) || (a.status === 'done') - (b.status === 'done') || cmp(a, b));
        const tag = l.state === 'pasado' ? '<span class="tag vencido">vencido</span>' : l.state === 'vigente' ? '<span class="tag vigente">vigente</span>' : '<span class="tag futuro">futuro</span>';
        const cap = sum(l.projects.map(x => VEL[x.p.id]?.value || 0));
        const plannedPts = sum(list.map(ptsOf));
        const est = l.projects.flatMap(x => proj.lanes.get(`${x.p.id}|${l.id}`) || []);
        const estPts = sum(est.map(ptsOf));
        const declared = l.projects.filter(x => x.s.declared).map(x => x.p.title);
        const loadBar = l.state !== 'pasado' && cap ? `<div class="load" title="Planificado ${plannedPts} + estimado ${estPts} de una capacidad de ${cap} pts"><span style="width:${Math.min(100, 100 * plannedPts / cap)}%;background:var(--accent)"></span><span style="width:${Math.max(0, Math.min(100 - 100 * plannedPts / cap, 100 * estPts / cap))}%;background:var(--muted);opacity:.5"></span></div>` : '';
        head = `<h3><span class="mono">${shortSp(l.id)}</span><span class="muted" style="font-size:13px;font-family:var(--body);font-weight:400">${fmt(l.start)}–${fmt(l.end)}</span></h3>
          <div class="sub">${tag}<span>${l.projects.map(x => `<span class="dot" style="--c:${x.p.color};display:inline-block"></span>`).join(' ')}</span>${cap && l.state !== 'pasado' ? `<span class="mono">${plannedPts}+${estPts}/${cap} pts</span>` : ''}${declared.length < l.projects.length ? `<span>sin sprint en el roadmap: ${l.projects.filter(x => !x.s.declared).map(x => esc(x.p.title)).join(', ')}</span>` : ''}</div>${loadBar}`;
        if (est.length) {
          const show = est.slice(0, 6);

  // ---------- línea de tiempo ----------
  function renderTimeline(all, proj) {
    const el = document.getElementById('view-linea');
    const rows = PROJ.filter(p => inFilter(p.id) && (SPR[p.id] || []).length);
    const items = [];
    for (const p of rows) {
      for (const s of sprintsOf(p.id)) {
        const st = stateOf(s);
        const hasEst = proj.lanes.has(`${p.id}|${s.id}`);
        const hasCards = all.some(c => c.project === p.id && c.lane === s.id);
        if (!s.declared && !(hasEst || hasCards || st === 'vigente')) continue;
        let cls = !s.declared ? 'est' : s.status === 'completed' ? 'closed' : st === 'pasado' ? 'overdue' : st === 'vigente' ? 'current' : 'planned';
        if (s.declared && st === 'vigente') cls = 'current';
        items.push({ p, s, cls, hitos: DATA.deliverables.filter(d => d.project === p.id && d.sprintId === s.id) });
      }
    }
    if (!items.length) { el.innerHTML = '<p class="nodata">No hay sprints para el filtro elegido.</p>'; return; }
    const minT = Math.min(...items.map(i => toT(i.s.start))), maxT = Math.max(...items.map(i => toT(i.s.end)));
    const mon = minT - ((new Date(minT).getUTCDay() + 6) % 7) * DAY;
    const weeks = Math.ceil((maxT - mon + DAY) / (7 * DAY));
    const wk = t => Math.floor((t - mon) / (7 * DAY));
    let head = `<div class="lbl" style="grid-row:1;grid-column:1;border-bottom:1px solid var(--line)"><span class="muted">Proyecto</span></div>`;
    let lastMonth = -1;
    for (let w = 0; w < weeks; w++) {
      const t = mon + w * 7 * DAY, d = new Date(t), m = d.getUTCMonth();
      const lbl = m !== lastMonth ? d.toLocaleDateString('es', { month: 'short', timeZone: 'UTC' }) : 'W' + isoWeekId(t).slice(-2);
      head += `<div class="wk${m !== lastMonth ? ' month' : ''}" style="grid-row:1;grid-column:${w + 2}" title="${isoWeekId(t)} · ${fmt(toS(t))}">${esc(lbl)}</div>`;
      lastMonth = m;
    }
    let body = '';
    rows.forEach((p, r) => {
      body += `<div class="lbl" style="grid-row:${r + 2};grid-column:1"><span class="dot" style="--c:${p.color}"></span><span title="${esc(p.title)}">${esc(p.title)}</span></div><div class="row-bg" style="grid-row:${r + 2}"></div>`;
      for (const it of items.filter(i => i.p === p)) {
        const a = wk(toT(it.s.start)), span = Math.max(1, Math.round((toT(it.s.end) - toT(it.s.start) + DAY) / (7 * DAY)));
        const past = stateOf(it.s) === 'pasado';
        const dias = it.hitos.map(h => `<i class="dia ${past && h.status !== 'accepted' ? 'miss' : h.status}" title="${esc(h.title)} · ${L.hito[h.status] || h.status}"></i>`).join('');
        const key = `${p.id}|${it.s.id}`;
        body += `<div class="sp ${it.cls}${state.sel === key ? ' sel' : ''}" role="button" tabindex="0" data-sp="${esc(key)}" style="grid-row:${r + 2};grid-column:${a + 2} / span ${span};--c:${p.color}" title="${esc(p.title)} · ${it.s.id} · ${fmt(it.s.start)}–${fmt(it.s.end)}">${shortSp(it.s.id)}${dias}</div>`;
      }
    });
    const todayLeft = `calc(var(--label) + ${((NOW - mon) / (7 * DAY)).toFixed(3)} * var(--week))`;
    const legend = `<div class="legend"><span><i style="background:color-mix(in srgb,var(--fg) 22%,var(--surface))"></i>cerrado</span><span><i style="background:var(--fg)"></i>vigente</span><span><i style="border:2px solid var(--bad)"></i>vencido sin cerrar</span><span><i style="border:1px solid var(--fg)"></i>planificado</span><span><i style="border:1px dashed var(--fg)"></i>estimado</span><span>Hitos: <i class="dia accepted" style="display:inline-block"></i>aceptado <i class="dia review" style="display:inline-block"></i>en revisión <i class="dia in_progress" style="display:inline-block"></i>en curso <i class="dia planned" style="display:inline-block"></i>planificado <i class="dia miss" style="display:inline-block"></i>sin aceptar en sprint pasado</span></div>`;
    const past = DATA.deliverables.filter(d => inFilter(d.project) && d.sprintId && sprintOf(d.project, d.sprintId) && stateOf(sprintOf(d.project, d.sprintId)) === 'pasado')
      .map(d => ({ d, s: sprintOf(d.project, d.sprintId) })).sort((a, b) => b.s.start.localeCompare(a.s.start) || a.d.project.localeCompare(b.d.project));
    el.innerHTML = `${legend}<div class="tl-wrap"><div class="tl" style="grid-template-columns:var(--label) repeat(${weeks}, var(--week))">${head}${body}<div class="today" style="left:${todayLeft}"></div></div></div>
      <div id="spdetail">${sprintDetail(all, proj)}</div>
      <div class="panel"><h2>Hitos de sprints pasados</h2>${past.length ? `<div class="tablewrap"><table><thead><tr><th>Sprint</th><th>Fechas</th><th>Proyecto</th><th>Hito</th><th>Épica</th><th>Versión</th><th>Estado</th></tr></thead><tbody>${past.map(({ d, s }) => `<tr><td class="mono">${shortSp(s.id)}</td><td class="mono">${fmt(s.start)}–${fmt(s.end)}</td><td><span class="dot" style="--c:${P[d.project].color};display:inline-block"></span> ${esc(P[d.project].title)}</td><td>${esc(d.title)}</td><td class="mono">${esc(d.epicId || '')}</td><td class="mono">${esc(d.version || '')}</td><td class="st ${d.status === 'accepted' ? 'accepted' : 'miss'}">${L.hito[d.status] || esc(d.status)}${d.status !== 'accepted' ? ' · no aceptado' : ''}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">No hay hitos en sprints pasados para este filtro.</p>'}</div>`;
  }
  function sprintDetail(all, proj) {
    if (!state.sel) return `<p class="hint">Elegí un sprint en la línea de tiempo para ver su objetivo, tareas e hitos.</p>`;
    const [pid, sid] = state.sel.split('|'); const p = P[pid], s = sprintOf(pid, sid);
    if (!p || !s) return '';
    const st = stateOf(s);
    const ts = all.filter(c => c.project === pid && c.lane === sid);
    const hs = DATA.deliverables.filter(d => d.project === pid && d.sprintId === sid);
    const est = proj.lanes.get(`${pid}|${sid}`) || [];
    const done = sum(ts.filter(c => c.status === 'done' && c.points).map(c => c.points));
    return `<div class="panel" style="border-left:4px solid ${p.color}">
      <h2>${esc(p.title)} · <span class="mono">${esc(sid)}</span></h2>

      ${s.goal ? `<p>${esc(s.goal)}</p>` : ''}
      ${hs.length ? `<div><h3>Hitos</h3><ul>${hs.map(h => `<li>${esc(h.title)} <span class="st ${h.status}">· ${L.hito[h.status] || esc(h.status)}</span> <span class="mono muted">${esc(h.version || '')}</span></li>`).join('')}</ul></div>` : ''}
      ${ts.length ? `<div class="tablewrap"><table><thead><tr><th>Tarjeta</th><th>Título</th><th>Puntos</th><th>Estado</th></tr></thead><tbody>${ts.map(c => `<tr><td class="mono">${esc(c.label)}</td><td>${esc(c.title)}${c.proposal ? ' <span class="mini prop">propuesta</span>' : ''}</td><td class="num">${c.points ?? '—'}</td><td class="st ${c.status}">${c.type === 'task' ? (L.task[c.status] || c.status) : (L.item[c.status] || c.status)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">Sin tareas registradas en este sprint.</p>'}
      ${est.length ? `<div><h3>Estimado por velocidad</h3><ul>${est.map(c => `<li>${esc(c.title)} <span class="mono muted">${c.points ?? '≈' + MED[pid]} pts</span></li>`).join('')}</ul></div>` : ''}</div>`;
  }

  // ---------- propuestas ----------
  const q = s => '"' + String(s).replace(/(["\\$`])/g, '\\$1') + '"';
  function describe(p) {
    const base = BASEMAP.get(p.key); if (!base) return { lines: ['La tarjeta ya no existe en los datos actuales.'], cmds: [] };
    const lines = [], cmds = [];
    const id = base.ref.id;
    if (base.type === 'backlog') {
      const parts = p.split?.parts || [];
      if (parts.length) {
        lines.push(`Partir en ${parts.length}: ${parts.map(x => `«${x.title}» (${x.points ?? 's/t'})`).join(', ')}.`);
        parts.forEach((x, i) => cmds.push(`npm run backlog -- add --title ${q(x.title)} --summary ${q(`Parte ${i + 1} de ${parts.length} de ${id}. ${x.title}`)} --project ${base.project}${x.points ? ` --effort ${x.points}` : ''}${p.triage ? ` --suggested-priority ${p.triage.priority}` : ''}`));
        cmds.push(`npm run backlog -- withdraw --id ${id} --by "<PO>" --reason ${q(`Partido en ${parts.length} pedidos`)}`);
        parts.forEach((x, i) => { if (x.to && x.to !== 'triaged' && x.to !== 'open') lines.push(`Programar la parte ${i + 1} en ${x.to}, una vez creada.`); });
      }
      if (p.triage && !parts.length) { lines.push(`Curar con prioridad ${p.triage.priority}.`); cmds.push(`npm run backlog -- triage --id ${id} --priority ${p.triage.priority} --decided-by "<PO>"`); }
      if (p.triage && parts.length) lines.push(`Las partes nacen con prioridad ${p.triage.priority}; confirmarla con triage al crearlas.`);
      if (p.move?.to && p.move.to !== 'triaged') { lines.push(`Programar en ${p.move.to}.`); if (!parts.length) cmds.push(`npm run backlog -- promote --id ${id} --epic ${base.ref.epicId || '<EP-NN>'} --sprint ${p.move.to} --decided-by "<PO>"`); }
    } else {
      const path = P[base.project]?.path || '.roadmap.json';
      if (p.move?.to) lines.push(`Mover ${id} de ${base.src} a ${p.move.to}: editar su sprintId en ${path}.`);
      const parts = p.split?.parts || [];
      if (parts.length) lines.push(`Partir ${id} en ${parts.length} tareas en ${path}: ${parts.map(x => `«${x.title}» (${x.points ?? 's/t'}${x.to ? ', ' + x.to : ''})`).join(', ')}.`);
    }
    return { lines, cmds };
  }
  function renderProposals() {
    const el = document.getElementById('view-propuestas');
    const list = [...state.proposals.values()].filter(p => inFilter(p.project)).sort((a, b) => a.project.localeCompare(b.project) || a.key.localeCompare(b.key));
    const offline = state.dbStatus !== 'ok';
    if (!list.length) {
      el.innerHTML = `<div class="panel"><h2>Propuestas</h2><p class="muted">Todavía no hay propuestas${state.filter.size ? ' para este filtro' : ''}. Arrastrá una tarjeta en el tablero o abrila para partirla.${offline ? ' Mientras la base del artifact no responda, las propuestas solo viven en esta sesión.' : ''}</p></div>`;
      return;
    }
    const all = list.map(p => ({ p, d: describe(p) }));
    const cmds = all.flatMap(x => x.d.cmds.length ? [`# ${x.p.key.slice(2)}`, ...x.d.cmds] : []);
    const manual = all.filter(x => !x.d.cmds.length || x.p.type === 'task');
    el.innerHTML = `<div class="panel"><h2>Propuestas · ${list.length}</h2>
      <p class="muted">Son borradores para el PO. No cambian la cola ni los roadmaps. Se aplican en el checkout operador del precursor con los comandos del backlog, reemplazando <span class="mono">&lt;PO&gt;</span> y las épicas pendientes. Lo que no tiene comando requiere editar el roadmap.</p>
      ${cmds.length ? `<div class="formrow"><button class="btn primary" id="copycmds">Copiar comandos</button><span class="hint">${cmds.filter(c => !c.startsWith('#')).length} comando(s)${manual.length ? ` · ${manual.length} cambio(s) manuales en roadmaps` : ''}</span></div><pre class="cmds" id="cmds">${esc(cmds.join('\n'))}</pre>` : ''}</div>
      <div class="props">${all.map(({ p, d }) => { const b = BASEMAP.get(p.key); return `<div class="prop" style="--c:${P[p.project]?.color}">
        <div class="row"><b>${esc(b ? b.title : p.key)}</b><span class="mono muted" style="font-size:12px">${esc(b ? b.label : p.key)}</span></div>
        <ul>${d.lines.map(l => `<li>${esc(l)}</li>`).join('')}</ul>
        <div class="row"><span class="hint">${p.at ? 'Propuesta del ' + fmt(p.at.slice(0, 10)) : ''}${isStale(p, b) ? ' · <b style="color:var(--bad)">la fuente cambió desde entonces: revisala</b>' : ''}</span>
        <span class="formrow"><button class="btn" data-open="${esc(p.key)}">Abrir</button>${state.canWrite ? `<button class="btn danger" data-discard="${esc(p.key)}">Descartar</button>` : ''}</span></div></div>`; }).join('')}</div>`;
  }

  // ---------- detalle y partición ----------
  const dlg = document.getElementById('detail');
  function openDetail(key) {
    const all = cards(); const c = all.find(x => x.key === key) || all.find(x => x.parent === key);
    if (!c) return;
    const rootKey = c.parent || c.key, base = BASEMAP.get(rootKey), p = state.proposals.get(rootKey);
    const proj = projection(all);
    const r = base.ref;
    const lanes = boardLanes(all, proj).map(l => l.id).concat(sprintsOf(c.project).filter(s => stateOf(s) !== 'pasado').map(s => s.id));
    const opts = [...new Set(lanes)].filter(l => canDrop(c, l) || l === c.lane);
    const laneName = l => l === 'open' ? 'Sin curar' : l === 'triaged' ? 'Curado' : l === 'closed' ? 'Cerrados' : `${shortSp(l)} · ${fmt(sprintOf(c.project, l)?.start)}`;
    const editable = state.canWrite && c.status !== 'done' && c.lane !== 'closed';
    const parts = p?.split?.parts || [];
    const stem = base.title.split(/\. | \(|: /)[0].slice(0, 90).trim();
    const seed = parts.length ? parts : [1, 2].map(n => ({ title: `${stem} · parte ${n}`, points: base.points ? (n === 1 ? Math.ceil(base.points / 2) : Math.floor(base.points / 2)) : null }));
    dlg.innerHTML = `<button class="btn close" data-close>Cerrar</button><div class="dlg">
      <div class="meta"><span class="dot" style="--c:${P[c.project].color}"></span><span class="mono muted">${esc(base.label)}</span>${c.parent ? `<span class="mini prop">parte ${c.partIndex + 1} de ${c.partCount}</span>` : ''}</div>
      <h2>${esc(c.title)}</h2>
      <div class="meta">${c.points == null ? '<span class="pts none">s/t</span>' : `<span class="pts${c.points >= BIG ? ' xl' : ''}">${c.points} pts</span>`}

        ${r.requestedAt ? `<span class="mini">pedido el ${fmt(r.requestedAt.slice(0, 10))}</span>` : ''}${r.decideBy ? `<span class="mini">decidir antes del ${fmt(r.decideBy)}</span>` : ''}
        ${proj.eta.get(c.key) && proj.eta.get(c.key) !== 'beyond' ? `<span class="mini est">≈ ${shortSp(proj.eta.get(c.key))}</span>` : ''}</div>
      ${r.summary ? `<p>${esc(r.summary)}</p>` : ''}${r.recommendation ? `<p><b>Recomendación:</b> ${esc(r.recommendation)}</p>` : ''}
      ${r.sourceRef ? `<p class="hint mono">${esc(r.sourceRef)}</p>` : ''}
      ${p && isStale(p, base) ? `<p style="color:var(--bad)">La fuente cambió desde que se hizo la propuesta: estaba en «${esc(p.base.lane)}» con estado ${esc(p.base.status)}.</p>` : ''}
      ${editable ? `<section><h3>Mover</h3><div class="formrow"><select id="moveTo">${opts.map(l => `<option value="${esc(l)}"${l === c.lane ? ' selected' : ''}>${esc(laneName(l))}</option>`).join('')}</select><button class="btn" data-move="${esc(c.key)}">Proponer</button></div></section>` : ''}
      ${editable && base.type === 'backlog' && !c.parent && base.src === 'open' ? `<section><h3>Curar</h3><div class="formrow"><select id="triagePri">${['P0', 'P1', 'P2'].map(x => `<option${(p?.triage?.priority || r.suggestedPriority || 'P2') === x ? ' selected' : ''}>${x}</option>`).join('')}</select><button class="btn" data-triage="${esc(rootKey)}">Proponer prioridad</button>${p?.triage ? `<button class="btn" data-untriage="${esc(rootKey)}">Quitar</button>` : ''}</div></section>` : ''}
      ${editable ? `<section><h3>${parts.length ? 'Partición propuesta' : 'Partir'}</h3><p class="hint">${base.points ? `Suma original: ${base.points} pts.` : 'La tarjeta no tiene puntos; tallá cada parte.'} Cada parte se mueve por separado en el tablero.</p>
        <div class="parts" id="parts">${seed.map((x, i) => partRow(x, i)).join('')}</div>

      ${p && state.canWrite ? `<section><div class="formrow"><button class="btn danger" data-discard="${esc(rootKey)}">Descartar todas las propuestas de esta tarjeta</button></div></section>` : ''}
    </div>`;

    if (!dlg.open) { try { dlg.showModal(); } catch { dlg.setAttribute('open', ''); } }
  }
  const partRow = (x, i) => `<div class="part"><input id="pt-title-${i}" aria-label="Título de la parte ${i + 1}" value="${esc(x.title)}"><input id="pt-pts-${i}" class="mono" type="number" min="0" step="1" inputmode="numeric" aria-label="Puntos de la parte ${i + 1}" value="${x.points ?? ''}" placeholder="pts"><button class="btn" data-rmpart="${i}" aria-label="Quitar parte ${i + 1}">Quitar</button></div>`;

  }

  // ---------- render principal ----------
  function render() {

    const d = e.target.closest('[data-discard]'); if (d) { saveProposal(d.dataset.discard, null); toast('Propuesta descartada.'); return; }
    const sp = e.target.closest('[data-sp]'); if (sp) { state.sel = state.sel === sp.dataset.sp ? null : sp.dataset.sp; render(); document.getElementById('spdetail')?.scrollIntoView({ block: 'nearest' }); return; }
    if (e.target.id === 'copycmds') {
      const text = document.getElementById('cmds').textContent;
      navigator.clipboard?.writeText(text).then(() => toast('Comandos copiados.'), () => { selectText(document.getElementById('cmds')); toast('Seleccioné los comandos: copialos con el teclado.'); }) ?? (selectText(document.getElementById('cmds')), toast('Seleccioné los comandos: copialos con el teclado.'));
      return;
    }
    const card = e.target.closest('.card'); if (card) openDetail(card.dataset.key);
  });
  app.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const card = e.target.closest('.card, [data-sp]'); if (!card) return;
    e.preventDefault(); card.click();
  });
  function selectText(el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

  let dragKey = null;
  app.addEventListener('dragstart', e => {
    const c = e.target.closest('.card'); if (!c || c.getAttribute('draggable') !== 'true') return;
    dragKey = c.dataset.key; c.classList.add('dragging');
    try { e.dataTransfer.setData('text/plain', dragKey); e.dataTransfer.effectAllowed = 'move'; } catch { /* navegador sin dataTransfer */ }
    const cur = cards().find(x => x.key === dragKey);
    app.querySelectorAll('.lane').forEach(l => { if (!canDrop(cur, l.dataset.lane) && l.dataset.lane !== cur?.lane) l.classList.add('nodrop'); });
  });
  app.addEventListener('dragend', () => { dragKey = null; app.querySelectorAll('.dragging,.drop,.nodrop').forEach(x => x.classList.remove('dragging', 'drop', 'nodrop')); });
  app.addEventListener('dragover', e => {
    const l = e.target.closest('.lane'); if (!l || !dragKey) return;
    const cur = cards().find(x => x.key === dragKey);
    if (canDrop(cur, l.dataset.lane) && l.dataset.lane !== cur.lane) { e.preventDefault(); app.querySelectorAll('.lane.drop').forEach(x => x !== l && x.classList.remove('drop')); l.classList.add('drop'); }
  });
  app.addEventListener('dragleave', e => { const l = e.target.closest('.lane'); if (l && !l.contains(e.relatedTarget)) l.classList.remove('drop'); });
  app.addEventListener('drop', e => {
    const l = e.target.closest('.lane'); if (!l || !dragKey) return; e.preventDefault();
    const k = dragKey; dragKey = null; applyMove(k, l.dataset.lane);
  });

  dlg.addEventListener('click', e => {
    if (e.target === dlg || e.target.closest('[data-close]')) { dlg.close(); return; }
    const t = e.target;
    if (t.dataset.move) { const to = dlg.querySelector('#moveTo').value; dlg.close(); applyMove(t.dataset.move, to); return; }
    if (t.dataset.triage) { const k = t.dataset.triage, p = clone(state.proposals.get(k)); p.triage = { priority: dlg.querySelector('#triagePri').value }; saveProposal(k, p); toast(`Prioridad ${p.triage.priority} propuesta.`); openDetail(k); return; }
    if (t.dataset.untriage) { const k = t.dataset.untriage, p = clone(state.proposals.get(k)); delete p.triage; if (p.move && BASEMAP.get(k).src === 'open') delete p.move; saveProposal(k, p); openDetail(k); return; }
    if (t.id === 'addPart') { const box = dlg.querySelector('#parts'); const i = box.children.length; box.insertAdjacentHTML('beforeend', partRow({ title: '', points: null }, i)); box.lastElementChild.querySelector('input').focus(); updatePartSum(); return; }
    if (t.dataset.rmpart) { t.closest('.part').remove(); updatePartSum(); return; }
    if (t.dataset.split) {
      const k = t.dataset.split, parts = readParts();
      if (parts.length < 2) { toast('Una partición necesita al menos dos partes con título.'); return; }
      const p = clone(state.proposals.get(k)); const old = p.split?.parts || [];
      p.split = { parts: parts.map((x, i) => ({ ...x, to: old[i]?.to || null })) };
      saveProposal(k, p); dlg.close(); toast(`Partición propuesta en ${parts.length} tarjetas.`); return;
    }
    if (t.dataset.unsplit) { const k = t.dataset.unsplit, p = clone(state.proposals.get(k)); delete p.split; saveProposal(k, p); dlg.close(); toast('Partición deshecha.'); return; }
    if (t.dataset.discard) { saveProposal(t.dataset.discard, null); dlg.close(); toast('Propuesta descartada.'); }
  });
  dlg.addEventListener('input', () => updatePartSum());
  window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (['tablero', 'linea', 'propuestas'].includes(v)) { state.view = v; render(); } });

  render();

  // ---------- base del artifact ----------
  (async () => {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') { state.dbStatus = 'off'; renderSources(); return; }
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    if (user) {
      try { state.userId = await user.id(); } catch { state.userId = null; }
      try { const w = await user.can('data.write'); if (w === false) state.canWrite = false; } catch { /* sin respuesta: se decide al escribir */ }
    }
    if (!db) { state.dbStatus = 'off'; render(); return; }
    state.db = db;
    const timer = setTimeout(() => { if (state.dbStatus === 'conectando') { state.dbStatus = 'lento'; renderSources(); } }, 10000);
    db.collection('proposals').onSnapshot(snap => {
      const m = new Map();
      for (const d of snap.docs) { if (!d.exists) continue; const body = d.data(); if (body && typeof body.key === 'string' && BASEMAP.has(body.key)) m.set(body.key, JSON.parse(JSON.stringify(body))); }
      state.proposals = m;
      if (!snap.metadata.fromCache) { clearTimeout(timer); state.dbStatus = 'ok'; }
      render();
    }, () => { clearTimeout(timer); state.dbStatus = 'error'; render(); });
  })();
})();
</script>
